name: Publish release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to recover (for example, v0.2.35)
        required: true
        type: string
      source_sha:
        description: Full immutable source commit SHA on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      mode: ${{ steps.intent.outputs.mode }}
      release_tag: ${{ steps.intent.outputs.release_tag }}
      source_sha: ${{ steps.intent.outputs.source_sha }}
      should_create_tag: ${{ steps.intent.outputs.should_create_tag }}
      should_publish: ${{ steps.intent.outputs.should_publish }}
    steps:
      - name: Check out release workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Require default-branch workflow code for recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKFLOW_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$WORKFLOW_REF" = "refs/heads/$DEFAULT_BRANCH" || {
            echo "Refusing recovery: workflow_dispatch must run from the default branch" >&2
            exit 1
          }

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve package-version release intent
        id: intent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          RELEASE_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
          RELEASE_PREDECESSOR_ATTEMPTS: "120"
          RELEASE_PREDECESSOR_DELAY_MS: "15000"
        run: bun "$GITHUB_WORKSPACE/release-tooling/scripts/release/intent.mjs" resolve

  validate:
    needs: resolve-release
    if: needs.resolve-release.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Verify tagged commit belongs to main
        env:
          SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
        run: |
          git show-ref --verify --quiet refs/remotes/origin/main || {
            echo "Refusing to publish: origin/main is unavailable in the checkout" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA" || {
            echo "Refusing to publish: checkout does not match immutable source $SOURCE_SHA" >&2
            exit 1
          }
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "Refusing to publish: source $SOURCE_SHA is not contained in origin/main" >&2
            exit 1
          }

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: bun run release:check-version "$RELEASE_TAG"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify complete dependency notices
        run: bun run licenses:check

      - name: Prepare private publication denylist
        env:
          PRIVATE_DENYLIST: ${{ secrets.LARKIN_PUBLICATION_DENYLIST }}
        run: |
          test -n "$PRIVATE_DENYLIST" || { echo "Required publication denylist is unavailable" >&2; exit 1; }
          umask 077
          printf '%s\n' "$PRIVATE_DENYLIST" > "$RUNNER_TEMP/larkin-publication-denylist.txt"

      - name: Verify public source, refs, and history
        run: bun run scripts/check-publication.mjs --trusted --denylist "$RUNNER_TEMP/larkin-publication-denylist.txt"

      - name: Check out recovery secret baseline
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          sparse-checkout: .gitleaksignore
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Apply exact recovery secret baseline
        id: recovery-secret-baseline
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-files --error-unmatch .gitleaksignore >/dev/null 2>&1; then
            cp -- .gitleaksignore "$RUNNER_TEMP/larkin-source-gitleaksignore"
            echo "source_baseline=present" >> "$GITHUB_OUTPUT"
          else
            echo "source_baseline=absent" >> "$GITHUB_OUTPUT"
          fi
          cp -- "$GITHUB_WORKSPACE/release-tooling/.gitleaksignore" "$GITHUB_WORKSPACE/.gitleaksignore"

      - name: Scan tagged history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Restore immutable source secret baseline
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          SOURCE_BASELINE: ${{ steps.recovery-secret-baseline.outputs.source_baseline }}
        run: |
          case "$SOURCE_BASELINE" in
            present)
              cp -- "$RUNNER_TEMP/larkin-source-gitleaksignore" .gitleaksignore
              ;;
            absent)
              rm -f -- .gitleaksignore
              ;;
            *)
              echo "Refusing to continue: immutable source baseline state was not recorded" >&2
              exit 1
              ;;
          esac

      - name: Remove Gitleaks SARIF output
        run: rm -f -- results.sarif

      - name: Run full test suite
        run: bun run test

  prepare-release:
    needs:
      - resolve-release
      - validate
    if: needs.resolve-release.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.prepare.outputs.should_publish }}
    steps:
      - name: Check out release workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Materialize immutable tag and reusable draft
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
          RELEASE_TAG_VISIBILITY_ATTEMPTS: "15"
          RELEASE_TAG_VISIBILITY_DELAY_MS: "2000"
          RELEASE_VISIBILITY_ATTEMPTS: "15"
          RELEASE_VISIBILITY_DELAY_MS: "2000"
        run: bun "$GITHUB_WORKSPACE/release-tooling/scripts/release/intent.mjs" prepare

  build:
    needs:
      - resolve-release
      - prepare-release
    if: needs.prepare-release.outputs.should_publish == 'true' && github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Check out release workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Prepare private publication denylist
        env:
          PRIVATE_DENYLIST: ${{ secrets.LARKIN_PUBLICATION_DENYLIST }}
        run: |
          test -n "$PRIVATE_DENYLIST" || { echo "Required publication denylist is unavailable" >&2; exit 1; }
          umask 077
          printf '%s\n' "$PRIVATE_DENYLIST" > "$RUNNER_TEMP/larkin-publication-denylist.txt"

      - name: Build current platform release
        run: |
          bun run build
          bun scripts/release/build.ts --target "${{ matrix.target }}" --out-dir artifacts/release

      - name: Scan source history and built artifact
        run: bun run scripts/check-publication.mjs --trusted --denylist "$RUNNER_TEMP/larkin-publication-denylist.txt" artifacts/release/larkin-v* artifacts/release/THIRD_PARTY_NOTICES.txt

      - name: Smoke current platform artifact
        if: matrix.target != 'windows-x64'
        run: bun run release:smoke -- --release-dir artifacts/release

      - name: Upload platform artifact to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
        run: |
          bun "$GITHUB_WORKSPACE/release-tooling/scripts/release/intent.mjs" assert-draft
          manifest="artifacts/release/release-manifest-${RELEASE_TARGET}.json"
          mv artifacts/release/release-manifest.json "$manifest"
          gh release upload "$RELEASE_TAG" \
            artifacts/release/larkin-v* "$manifest" \
            --repo "$GITHUB_REPOSITORY"

  assemble-release:
    needs:
      - resolve-release
      - prepare-release
      - build
    if: >-
      always() &&
      needs.prepare-release.outputs.should_publish == 'true' &&
      (needs.build.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      # GitHub hides draft releases and their assets from read-only workflow tokens.
      contents: write
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Download platform artifacts from draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          mkdir -p artifacts/platform
          release_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\" and .draft == true) | .id"
          )"
          test -n "$release_id" && test "${release_id//$'\n'/}" = "$release_id" || {
            echo "Expected exactly one draft release for $RELEASE_TAG" >&2
            exit 1
          }
          metadata="$RUNNER_TEMP/larkin-release-assets.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > "$metadata"
          expected_assets=(
            "larkin-${RELEASE_TAG}-linux-x64"
            "larkin-${RELEASE_TAG}-linux-arm64"
            "larkin-${RELEASE_TAG}-darwin-arm64"
            "larkin-${RELEASE_TAG}-darwin-x64"
            "larkin-${RELEASE_TAG}-windows-x64.exe"
            release-manifest-linux-x64.json
            release-manifest-linux-arm64.json
            release-manifest-darwin-arm64.json
            release-manifest-darwin-x64.json
            release-manifest-windows-x64.json
          )
          for asset_name in "${expected_assets[@]}"; do
            mapfile -t asset_ids < <(
              jq -r --arg name "$asset_name" \
                '.[] | select(.name == $name and .state == "uploaded") | .id' "$metadata"
            )
            test "${#asset_ids[@]}" -eq 1 || {
              echo "Expected exactly one uploaded draft asset named $asset_name" >&2
              exit 1
            }
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_ids[0]}" \
              -H 'Accept: application/octet-stream' > "artifacts/platform/$asset_name"
          done

      - name: Assemble release manifest and checksums
        run: bun scripts/release/assemble.ts --input-dir artifacts/platform --out-dir artifacts/release

      - name: Verify release notices
        run: |
          cmp LICENSE artifacts/release/LICENSE
          bun run scripts/generate-third-party-notices.mjs --check --output artifacts/release/THIRD_PARTY_NOTICES.txt

      - name: Upload immutable assembled release
        uses: actions/upload-artifact@v4
        with:
          name: assembled-release-${{ needs.resolve-release.outputs.source_sha }}
          path: release-source/artifacts/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify-windows-release:
    needs:
      - resolve-release
      - prepare-release
      - assemble-release
    if: needs.prepare-release.outputs.should_publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Check out release workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Download exact assembled release
        uses: actions/download-artifact@v4
        with:
          name: assembled-release-${{ needs.resolve-release.outputs.source_sha }}
          path: release-source/artifacts/release

      - name: Verify immutable source, Windows manifest, and SHA256SUMS
        shell: pwsh
        env:
          RELEASE_SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:RELEASE_SOURCE_SHA) { throw "immutable source checkout mismatch" }
          $manifest = Get-Content artifacts/release/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -ne $env:RELEASE_SOURCE_SHA -or $manifest.sourceDirty -ne $false) { throw "Windows manifest source provenance mismatch" }
          $records = @($manifest.artifacts | Where-Object { $_.platform -eq 'windows' -and $_.arch -eq 'x64' })
          if ($records.Count -ne 1) { throw "expected exactly one Windows x64 manifest record" }
          $record = $records[0]
          $sumLines = @(Get-Content artifacts/release/SHA256SUMS | Where-Object { $_ -match ('  ' + [regex]::Escape($record.file) + '$') })
          if ($sumLines.Count -ne 1) { throw "expected exactly one Windows x64 SHA256SUMS record" }
          $expected = ($sumLines[0] -split '\s+', 2)[0].ToLowerInvariant()
          $actual = (Get-FileHash (Join-Path artifacts/release $record.file) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $record.sha256 -or $actual -ne $record.sha256) { throw "Windows artifact checksum mismatch" }

      - name: Smoke exact assembled Windows executable natively
        run: bun "${{ github.workspace }}/release-tooling/scripts/release/smoke.ts" --release-dir artifacts/release

  publish:
    needs:
      - resolve-release
      - prepare-release
      - assemble-release
      - verify-windows-release
    if: needs.prepare-release.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Check out release workflow tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Download Windows-verified assembled release
        uses: actions/download-artifact@v4
        with:
          name: assembled-release-${{ needs.resolve-release.outputs.source_sha }}
          path: release-source/artifacts/release

      - name: Verify release notices
        run: |
          cmp LICENSE artifacts/release/LICENSE
          bun run scripts/generate-third-party-notices.mjs --check --output artifacts/release/THIRD_PARTY_NOTICES.txt

      - name: Finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
        run: |
          bun "$GITHUB_WORKSPACE/release-tooling/scripts/release/intent.mjs" assert-draft
          gh release upload "$RELEASE_TAG" \
            artifacts/release/SHA256SUMS artifacts/release/release-manifest.json \
            artifacts/release/LICENSE artifacts/release/THIRD_PARTY_NOTICES.txt \
            --repo "$GITHUB_REPOSITORY"
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64 windows-x64; do
            gh release delete-asset "$RELEASE_TAG" "release-manifest-${target}.json" \
              --repo "$GITHUB_REPOSITORY" --yes
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Trigger npm publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          gh workflow run "Publish npm package" --repo "$GITHUB_REPOSITORY" \
            --ref main -f release_tag="$RELEASE_TAG"
