name: Source checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify complete dependency notices
        run: bun run licenses:check

      - name: Verify generic public source tree for fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: bun run publication:check:tree

      - name: Prepare private publication denylist for trusted runs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PRIVATE_DENYLIST: ${{ secrets.LARKIN_PUBLICATION_DENYLIST }}
        run: |
          test -n "$PRIVATE_DENYLIST" || { echo "Required publication denylist is unavailable" >&2; exit 1; }
          umask 077
          printf '%s\n' "$PRIVATE_DENYLIST" > "$RUNNER_TEMP/larkin-publication-denylist.txt"

      - name: Verify trusted public source tree
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: bun run scripts/check-publication.mjs --tree-only --trusted --denylist "$RUNNER_TEMP/larkin-publication-denylist.txt"

      - name: Scan source for credential leaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Remove Gitleaks SARIF output
        run: rm -f -- results.sarif

      - name: Run full test suite
        run: bun run test

      - name: Exercise official lark-channel bind on hosted Linux
        env:
          LARKIN_RUN_OFFICIAL_LARK_CHANNEL_BIND: "1"
        run: bun test --max-concurrency 1 test/integration/app/official-lark-channel-bind-live.test.mjs

  windows-release-artifact:
    name: Build Windows x64 standalone artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build source and Windows standalone
        run: |
          bun run build
          bun scripts/release/build.ts --target windows-x64 --out-dir artifacts/release

      - name: Upload Windows standalone for native verification
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  windows-native:
    name: Windows 11 x64 core and standalone gate
    needs: windows-release-artifact
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build source on native Windows
        run: bun run build

      - name: Run focused Windows unit and integration tests
        run: bun test --max-concurrency 1 test/unit/platform/release-artifacts.test.mjs test/unit/runtime/pi-inline-extensions.test.mjs test/unit/runtime/runtime-adapters.test.mjs test/integration/build/runtime-clean-cutover.test.mjs test/integration/build/release-platform-ci.test.mjs

      - name: Download exact Windows standalone build
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: artifacts/release

      - name: Smoke Windows standalone natively
        run: bun run release:smoke -- --release-dir artifacts/release
