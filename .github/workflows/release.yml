name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up pinned Go for embedded license closure
        uses: actions/setup-go@v6
        with:
          go-version: 1.23.12
          cache: false

      - name: Verify tagged commit belongs to main
        run: |
          git show-ref --verify --quiet refs/remotes/origin/main || {
            echo "Refusing to publish: origin/main is unavailable in the checkout" >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Refusing to publish: tagged commit $GITHUB_SHA is not contained in origin/main" >&2
            exit 1
          }

      - name: Validate release version
        run: bun run release:check-version "${GITHUB_REF_NAME}"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify complete dependency notices
        run: bun run licenses:check

      - name: Prepare private publication denylist
        env:
          PRIVATE_DENYLIST: ${{ secrets.LARKIN_PUBLICATION_DENYLIST }}
        run: |
          test -n "$PRIVATE_DENYLIST" || { echo "Required publication denylist is unavailable" >&2; exit 1; }
          umask 077
          printf '%s\n' "$PRIVATE_DENYLIST" > "$RUNNER_TEMP/larkin-publication-denylist.txt"

      - name: Verify public source, refs, and history
        run: bun run scripts/check-publication.mjs --trusted --denylist "$RUNNER_TEMP/larkin-publication-denylist.txt"

      - name: Scan tagged history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Remove Gitleaks SARIF output
        run: rm -f -- results.sarif

      - name: Run full test suite
        run: bun run test

  prepare-release:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create reusable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to overwrite published release $RELEASE_TAG" >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --generate-notes --title "Larkin $RELEASE_TAG"
          fi

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up pinned Go for embedded license closure
        uses: actions/setup-go@v6
        with:
          go-version: 1.23.12
          cache: false

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Prepare private publication denylist
        env:
          PRIVATE_DENYLIST: ${{ secrets.LARKIN_PUBLICATION_DENYLIST }}
        run: |
          test -n "$PRIVATE_DENYLIST" || { echo "Required publication denylist is unavailable" >&2; exit 1; }
          umask 077
          printf '%s\n' "$PRIVATE_DENYLIST" > "$RUNNER_TEMP/larkin-publication-denylist.txt"

      - name: Build current platform release
        run: |
          bun run build
          bun scripts/release/build.ts --target "${{ matrix.target }}" --out-dir artifacts/release

      - name: Scan source history and built artifact
        run: bun run scripts/check-publication.mjs --trusted --denylist "$RUNNER_TEMP/larkin-publication-denylist.txt" --allow-embedded-lark-cli node_modules/@larksuite/cli/bin/lark-cli artifacts/release/larkin-v* artifacts/release/THIRD_PARTY_NOTICES.txt

      - name: Smoke current platform artifact
        run: bun run release:smoke -- --release-dir artifacts/release

      - name: Upload platform artifact to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          manifest="artifacts/release/release-manifest-${RELEASE_TARGET}.json"
          mv artifacts/release/release-manifest.json "$manifest"
          gh release upload "$RELEASE_TAG" \
            artifacts/release/larkin-v* "$manifest" \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up pinned Go for embedded license closure
        uses: actions/setup-go@v6
        with:
          go-version: 1.23.12
          cache: false

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Download platform artifacts from draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p artifacts/platform
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'larkin-v*' --pattern 'release-manifest-*.json' \
            --dir artifacts/platform

      - name: Assemble release manifest and checksums
        run: bun scripts/release/assemble.ts --input-dir artifacts/platform --out-dir artifacts/release

      - name: Verify release notices
        run: |
          cmp LICENSE artifacts/release/LICENSE
          bun run scripts/generate-third-party-notices.mjs --check --output artifacts/release/THIRD_PARTY_NOTICES.txt

      - name: Finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            artifacts/release/SHA256SUMS artifacts/release/release-manifest.json \
            artifacts/release/LICENSE artifacts/release/THIRD_PARTY_NOTICES.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          for manifest in artifacts/platform/release-manifest-*.json; do
            gh release delete-asset "$RELEASE_TAG" "$(basename "$manifest")" \
              --repo "$GITHUB_REPOSITORY" --yes
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
