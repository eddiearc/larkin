name: Release platform smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-smoke:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            full_test: true
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            full_test: false
          - runner: macos-15
            target: darwin-arm64
            full_test: false
          - runner: macos-15-intel
            target: darwin-x64
            full_test: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify complete dependency notices
        if: matrix.full_test
        run: bun run licenses:check

      - name: Verify generic public source tree for pull requests
        if: matrix.full_test && github.event_name == 'pull_request'
        run: bun run publication:check:tree

      - name: Prepare private publication denylist for trusted runs
        if: github.event_name != 'pull_request'
        env:
          PRIVATE_DENYLIST: ${{ secrets.LARKIN_PUBLICATION_DENYLIST }}
        run: |
          test -n "$PRIVATE_DENYLIST" || { echo "Required publication denylist is unavailable" >&2; exit 1; }
          umask 077
          printf '%s\n' "$PRIVATE_DENYLIST" > "$RUNNER_TEMP/larkin-publication-denylist.txt"

      - name: Verify trusted public source tree
        if: matrix.full_test && github.event_name != 'pull_request'
        run: bun run scripts/check-publication.mjs --tree-only --trusted --denylist "$RUNNER_TEMP/larkin-publication-denylist.txt"

      - name: Scan source for credential leaks
        if: matrix.full_test
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Remove Gitleaks SARIF output
        if: matrix.full_test
        run: rm -f -- results.sarif

      - name: Run full test suite
        if: matrix.full_test
        run: bun run test

      - name: Build current platform release
        run: |
          bun run build
          bun scripts/release/build.ts --target "${{ matrix.target }}" --out-dir artifacts/release

      - name: Scan built artifact for pull requests
        if: github.event_name == 'pull_request'
        run: bun run scripts/check-publication.mjs --tree-only artifacts/release/larkin-v*

      - name: Scan built artifact for trusted runs
        if: github.event_name != 'pull_request'
        run: bun run scripts/check-publication.mjs --tree-only --trusted --denylist "$RUNNER_TEMP/larkin-publication-denylist.txt" artifacts/release/larkin-v*

      - name: Smoke current platform artifact
        run: bun run release:smoke -- --release-dir artifacts/release
